<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D2 project</title>
  </head>
  <body>
    <main id="app">
      <h1>Sketchpad</h1>
      <canvas id = "canvas" width = "512" height = "512"></canvas>
      <div class = "toolbar">
        <button id = "redraw">Redraw</button>
        <button id = "redo">Redo</button>
        <button id = "undo">Undo</button>
        <button id = "clearPixels">Clear Pixels</button>
        <select id = "brushSelect">Select Brush</select>
        <input type="text" id="nameInput" placeholder="Name Sticker">
        <input type="text" id="stickerInput" placeholder="Insert Sticker">
        <button id = "addSticker">Add Sticker</button>
        <button id = "export">Export PNG</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
